[project]
name = "location-intelligence-backend"
version = "0.1.0"
description = "Versioned Berlin location data ingestion and query service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "geopandas>=1,<2",
  "pyproj>=3,<4",
  "pyogrio>=0.10,<1",
  "shapely>=2,<3",
  "pyarrow>=18,<24",
  "py7zr>=0.22,<2",
  "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
location-data = "app.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in tests that contact public providers"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
