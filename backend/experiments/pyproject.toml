[project]
name = "risalite-research-experiment"
version = "0.1.0"
description = "Minimal DeepAgents research loop on Nebius Token Factory and Tavily"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents>=0.7.28,<0.8",
  "langchain-nebius>=0.1.3,<0.2",
  "langchain-tavily>=0.2.18,<0.3",
]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
